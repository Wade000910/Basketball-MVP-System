<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>籃球動力鏈聽覺回饋系統 (濾波升級版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            background-color: #000;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
        video {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <div class="max-w-4xl mx-auto p-4 md:p-6">
        <header class="mb-6 text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-800 mb-2">籃球動力鏈聽覺回饋系統</h1>
            <p class="text-sm md:text-base text-gray-600">MVP 3.0：導入數據緩衝區與移動平均濾波</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2">
                <div class="video-container">
                    <video id="input_video" autoplay playsinline muted></video>
                    <canvas id="output_canvas" width="640" height="480"></canvas>
                    <div class="absolute top-2 left-2 bg-black bg-opacity-60 text-green-400 font-mono text-sm px-2 py-1 rounded z-20">
                        <span id="fps_display">-- FPS</span>
                    </div>
                </div>

                <div class="mt-4 flex flex-col items-center space-y-4">
                    <div class="flex space-x-4">
                        <button id="start_btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg text-lg">
                            啟動系統 (後鏡頭)
                        </button>
                        <button id="stop_btn" class="hidden bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-full shadow-lg text-lg">
                            停止系統
                        </button>
                    </div>

                    <div class="bg-white px-4 py-3 rounded shadow w-full max-w-md flex flex-col space-y-2">
                        <label class="flex justify-between items-center text-sm font-bold text-gray-700">
                            <span>移動平均濾波強度 (Buffer Size)</span>
                            <span id="buffer_value_display" class="text-blue-600">10 幀</span>
                        </label>
                        <input type="range" id="buffer_slider" min="1" max="30" value="10" class="w-full">
                        <p class="text-xs text-gray-500 text-center">數值越大越平滑，但反應會稍微變慢。</p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-md flex flex-col">
                <h2 class="text-xl font-bold text-gray-800 border-b pb-2 mb-4">濾波數據監控</h2>
                
                <div class="space-y-4 flex-grow">
                    <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                        <p id="status_display" class="font-bold text-lg text-blue-600 text-center">等待啟動...</p>
                    </div>

                    <div class="grid grid-cols-1 gap-3">
                        <div class="bg-gray-50 p-3 rounded-lg border-l-4 border-blue-400">
                            <p class="text-sm font-bold text-gray-700 mb-1">右手肘 (Elbow)</p>
                            <div class="flex justify-between items-baseline">
                                <p class="text-xs text-gray-400">原始: <span id="raw_elbow">0.0°</span></p>
                                <p class="text-xl font-mono text-blue-600">平滑: <span id="smooth_elbow">0.0°</span></p>
                            </div>
                        </div>

                        <div class="bg-gray-50 p-3 rounded-lg border-l-4 border-green-400">
                            <p class="text-sm font-bold text-gray-700 mb-1">右膝蓋 (Knee)</p>
                            <div class="flex justify-between items-baseline">
                                <p class="text-xs text-gray-400">原始: <span id="raw_knee">0.0°</span></p>
                                <p class="text-xl font-mono text-green-600">平滑: <span id="smooth_knee">0.0°</span></p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-purple-50 p-4 rounded-lg border border-purple-100 text-center">
                        <p class="text-sm text-purple-600 font-bold mb-1">估計時序差 (Δt)</p>
                        <p id="dt_display" class="text-3xl font-mono text-purple-700">-- ms</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- 1. Web Audio API ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playDing() { /* 簡化略，保持原邏輯 */
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.05); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }
        function playBuzz() { /* 簡化略，保持原邏輯 */
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return angle;
        }

        // --- 變數宣告 ---
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const statusDisplay = document.getElementById('status_display');
        const rawElbowDisplay = document.getElementById('raw_elbow');
        const smoothElbowDisplay = document.getElementById('smooth_elbow');
        const rawKneeDisplay = document.getElementById('raw_knee');
        const smoothKneeDisplay = document.getElementById('smooth_knee');
        const dtDisplay = document.getElementById('dt_display');
        const fpsDisplay = document.getElementById('fps_display');
        
        const startBtn = document.getElementById('start_btn');
        const stopBtn = document.getElementById('stop_btn');
        const bufferSlider = document.getElementById('buffer_slider');
        const bufferDisplay = document.getElementById('buffer_value_display');

        let isAnalyzing = false;
        let shotState = 'IDLE'; 
        let lastSmoothKnee = 180;
        let lastSmoothElbow = 180;
        let timeKneePeak = 0;
        let timeElbowStart = 0;
        let camera = null;

        let frameCount = 0;
        let lastFpsTime = performance.now();

        // 🌟 新增：數據緩衝區 (Data Buffer)
        let kneeBuffer = [];
        let elbowBuffer = [];
        let currentBufferSize = parseInt(bufferSlider.value);

        // 監聽滑桿改變緩衝區大小
        bufferSlider.addEventListener('input', (e) => {
            currentBufferSize = parseInt(e.target.value);
            bufferDisplay.innerText = currentBufferSize + " 幀";
        });

        // 🌟 新增：計算陣列平均值的函數 (Moving Average)
        function getAverage(arr) {
            if (arr.length === 0) return 0;
            const sum = arr.reduce((a, b) => a + b, 0);
            return sum / arr.length;
        }

        // --- MediaPipe 核心處理邏輯 ---
        function onResults(results) {
            if (!isAnalyzing) return;

            const now = performance.now();
            frameCount++;
            if (now - lastFpsTime >= 1000) {
                fpsDisplay.innerText = `${frameCount} FPS`;
                frameCount = 0;
                lastFpsTime = now;
            }

            if (!results.poseLandmarks) return;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#ffffff', lineWidth: 4});
            drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#3B82F6', lineWidth: 2, radius: 4});
            canvasCtx.restore();

            const landmarks = results.poseLandmarks;
            const shoulder = landmarks[12], elbow = landmarks[14], wrist = landmarks[16];
            const hip = landmarks[24], knee = landmarks[26], ankle = landmarks[28];

            if (shoulder.visibility < 0.5 || elbow.visibility < 0.5 || knee.visibility < 0.5) return;

            // 1. 取得原始角度 (Raw Data)
            const rawElbowAngle = calculateAngle(shoulder, elbow, wrist);
            const rawKneeAngle = calculateAngle(hip, knee, ankle);

            // 2. 將原始數據推入緩衝區
            elbowBuffer.push(rawElbowAngle);
            kneeBuffer.push(rawKneeAngle);

            // 3. 維持緩衝區大小 (把最舊的資料踢掉)
            if (elbowBuffer.length > currentBufferSize) elbowBuffer.shift();
            if (kneeBuffer.length > currentBufferSize) kneeBuffer.shift();

            // 4. 計算濾波後的平滑角度 (Smoothed Data)
            const smoothElbowAngle = getAverage(elbowBuffer);
            const smoothKneeAngle = getAverage(kneeBuffer);

            // 更新介面 (讓你看到原始跟平滑的差別)
            rawElbowDisplay.innerText = rawElbowAngle.toFixed(1) + '°';
            rawKneeDisplay.innerText = rawKneeAngle.toFixed(1) + '°';
            smoothElbowDisplay.innerText = smoothElbowAngle.toFixed(1) + '°';
            smoothKneeDisplay.innerText = smoothKneeAngle.toFixed(1) + '°';

            // ⚠️ 接下來的邏輯判定，全部改用「平滑後的數據」來做，避免雜訊干擾
            if (shotState === 'IDLE') {
                statusDisplay.innerText = "請微蹲準備";
                statusDisplay.className = "font-bold text-lg text-blue-600 text-center";
                if (smoothKneeAngle < 140) shotState = 'PREP';
            } 
            else if (shotState === 'PREP') {
                statusDisplay.innerText = "發力中...";
                statusDisplay.className = "font-bold text-lg text-yellow-600 text-center";
                
                if (smoothKneeAngle > lastSmoothKnee + 2 && smoothKneeAngle > 150 && timeKneePeak === 0) {
                    timeKneePeak = now;
                }

                if (smoothElbowAngle > lastSmoothElbow + 5 && timeElbowStart === 0) {
                    timeElbowStart = now;
                }

                if (smoothElbowAngle > 150 && timeKneePeak > 0 && timeElbowStart > 0) {
                    shotState = 'ANALYZING';
                    const dt = Math.round(timeElbowStart - timeKneePeak);
                    dtDisplay.innerText = dt + " ms";
                    statusDisplay.innerText = "運算中...";
                    
                    if (dt >= 50 && dt <= 150) {
                        playDing();
                        statusDisplay.innerText = "時序正確 (Ding!)";
                        statusDisplay.className = "font-bold text-lg text-green-600 text-center";
                    } else {
                        playBuzz();
                        statusDisplay.innerText = "時序失準 (Buzz!)";
                        statusDisplay.className = "font-bold text-lg text-red-600 text-center";
                    }
                    
                    setTimeout(() => {
                        shotState = 'IDLE';
                        timeKneePeak = 0;
                        timeElbowStart = 0;
                        dtDisplay.innerText = "-- ms";
                    }, 1500); 
                }
            }

            // 更新歷史變數 (使用平滑數據)
            lastSmoothKnee = smoothKneeAngle;
            lastSmoothElbow = smoothElbowAngle;
        }

        const pose = new Pose({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
        }});
        pose.setOptions({
            modelComplexity: 0, 
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        pose.onResults(onResults);

        startBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            
            // 每次啟動前清空緩衝區，避免殘留上次的數據
            kneeBuffer = [];
            elbowBuffer = [];

            if (!camera) {
                 camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await pose.send({image: videoElement});
                    },
                    width: 640,
                    height: 480,
                    facingMode: 'environment'
                });
            }
            
            camera.start();
            isAnalyzing = true;
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            statusDisplay.innerText = "系統運作中...";
        });

        stopBtn.addEventListener('click', () => {
            if (camera) camera.stop();
            isAnalyzing = false;
            stopBtn.classList.add('hidden');
            startBtn.classList.remove('hidden');
            statusDisplay.innerText = "系統已停止";
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            fpsDisplay.innerText = "-- FPS";
        });
    </script>
</body>
</html>
