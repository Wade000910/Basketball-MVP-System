<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>籃球動力鏈聽覺回饋系統 (角速度版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            background-color: #000;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
        video {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <div class="max-w-4xl mx-auto p-4 md:p-6">
        <header class="mb-6 text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-800 mb-2">籃球動力鏈聽覺回饋系統</h1>
            <p class="text-sm md:text-base text-gray-600">MVP 4.0：導入微積分求導與角速度追蹤</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2">
                <div class="video-container">
                    <video id="input_video" autoplay playsinline muted></video>
                    <canvas id="output_canvas" width="640" height="480"></canvas>
                    <div class="absolute top-2 left-2 bg-black bg-opacity-60 text-green-400 font-mono text-sm px-2 py-1 rounded z-20">
                        <span id="fps_display">-- FPS</span>
                    </div>
                </div>

                <div class="mt-4 flex flex-col items-center space-y-4">
                    <div class="flex space-x-4">
                        <button id="start_btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg text-lg">
                            啟動系統 (後鏡頭)
                        </button>
                        <button id="stop_btn" class="hidden bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-full shadow-lg text-lg">
                            停止系統
                        </button>
                    </div>

                    <div class="bg-white px-4 py-3 rounded shadow w-full max-w-md flex flex-col space-y-2">
                        <label class="flex justify-between items-center text-sm font-bold text-gray-700">
                            <span>移動平均濾波強度 (Buffer Size)</span>
                            <span id="buffer_value_display" class="text-blue-600">10 幀</span>
                        </label>
                        <input type="range" id="buffer_slider" min="1" max="30" value="10" class="w-full">
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-md flex flex-col">
                <h2 class="text-xl font-bold text-gray-800 border-b pb-2 mb-4">即時運動學數據 (Kinematics)</h2>
                
                <div class="space-y-4 flex-grow">
                    <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                        <p id="status_display" class="font-bold text-lg text-blue-600 text-center">等待啟動...</p>
                    </div>

                    <div class="bg-gray-50 p-3 rounded-lg border-l-4 border-blue-400">
                        <p class="text-sm font-bold text-gray-700 mb-2">右手肘 (Elbow)</p>
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs text-gray-500">角度 ($\theta$)</span>
                            <span id="smooth_elbow" class="font-mono text-blue-600 font-bold">0.0°</span>
                        </div>
                        <div class="flex justify-between items-center border-t border-gray-200 pt-1">
                            <span class="text-xs text-gray-500">角速度 ($\omega$)</span>
                            <span id="vel_elbow" class="font-mono text-red-500 font-bold">0.0 °/s</span>
                        </div>
                    </div>

                    <div class="bg-gray-50 p-3 rounded-lg border-l-4 border-green-400">
                        <p class="text-sm font-bold text-gray-700 mb-2">右膝蓋 (Knee)</p>
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs text-gray-500">角度 ($\theta$)</span>
                            <span id="smooth_knee" class="font-mono text-green-600 font-bold">0.0°</span>
                        </div>
                        <div class="flex justify-between items-center border-t border-gray-200 pt-1">
                            <span class="text-xs text-gray-500">角速度 ($\omega$)</span>
                            <span id="vel_knee" class="font-mono text-red-500 font-bold">0.0 °/s</span>
                        </div>
                    </div>

                    <div class="bg-purple-50 p-4 rounded-lg border border-purple-100 text-center">
                        <p class="text-sm text-purple-600 font-bold mb-1">估計時序差 (Δt)</p>
                        <p id="dt_display" class="text-3xl font-mono text-purple-700">-- ms</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playDing() { /* 省略詳細 Web Audio API 內容，保持原樣 */
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.05); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }
        function playBuzz() { 
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return angle;
        }

        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const statusDisplay = document.getElementById('status_display');
        const smoothElbowDisplay = document.getElementById('smooth_elbow');
        const velElbowDisplay = document.getElementById('vel_elbow');
        const smoothKneeDisplay = document.getElementById('smooth_knee');
        const velKneeDisplay = document.getElementById('vel_knee');
        const dtDisplay = document.getElementById('dt_display');
        const fpsDisplay = document.getElementById('fps_display');
        
        const startBtn = document.getElementById('start_btn');
        const stopBtn = document.getElementById('stop_btn');
        const bufferSlider = document.getElementById('buffer_slider');
        const bufferDisplay = document.getElementById('buffer_value_display');

        let isAnalyzing = false;
        let shotState = 'IDLE'; 
        let camera = null;

        // FPS 與時間變數
        let frameCount = 0;
        let lastFpsTime = performance.now();
        
        // 角速度計算專用時間戳記
        let lastFrameTime = 0; 

        let kneeBuffer = [];
        let elbowBuffer = [];
        let currentBufferSize = parseInt(bufferSlider.value);

        // 用來記錄「前一幀」的平滑角度，才能算出角度差
        let prevSmoothKnee = 180;
        let prevSmoothElbow = 180;

        let timeKneePeak = 0;
        let timeElbowStart = 0;

        bufferSlider.addEventListener('input', (e) => {
            currentBufferSize = parseInt(e.target.value);
            bufferDisplay.innerText = currentBufferSize + " 幀";
        });

        function getAverage(arr) {
            if (arr.length === 0) return 0;
            const sum = arr.reduce((a, b) => a + b, 0);
            return sum / arr.length;
        }

        function onResults(results) {
            if (!isAnalyzing) return;

            const now = performance.now();
            
            // 計算 FPS
            frameCount++;
            if (now - lastFpsTime >= 1000) {
                fpsDisplay.innerText = `${frameCount} FPS`;
                frameCount = 0;
                lastFpsTime = now;
            }

            if (!results.poseLandmarks) {
                lastFrameTime = now; // 即使沒抓到人，也要更新時間
                return;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#ffffff', lineWidth: 4});
            drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#3B82F6', lineWidth: 2, radius: 4});
            canvasCtx.restore();

            const landmarks = results.poseLandmarks;
            const shoulder = landmarks[12], elbow = landmarks[14], wrist = landmarks[16];
            const hip = landmarks[24], knee = landmarks[26], ankle = landmarks[28];

            if (shoulder.visibility < 0.5 || elbow.visibility < 0.5 || knee.visibility < 0.5) {
                lastFrameTime = now;
                return;
            }

            // 1. 取得原始角度並放入緩衝區 (濾波)
            elbowBuffer.push(calculateAngle(shoulder, elbow, wrist));
            kneeBuffer.push(calculateAngle(hip, knee, ankle));
            if (elbowBuffer.length > currentBufferSize) elbowBuffer.shift();
            if (kneeBuffer.length > currentBufferSize) kneeBuffer.shift();

            const smoothElbowAngle = getAverage(elbowBuffer);
            const smoothKneeAngle = getAverage(kneeBuffer);

            smoothElbowDisplay.innerText = smoothElbowAngle.toFixed(1) + '°';
            smoothKneeDisplay.innerText = smoothKneeAngle.toFixed(1) + '°';

            // 🌟 核心升級：計算角速度 (Velocity) 🌟
            let elbowVelocity = 0;
            let kneeVelocity = 0;

            if (lastFrameTime > 0) {
                // 將毫秒轉換為秒
                const deltaTimeInSeconds = (now - lastFrameTime) / 1000.0; 
                
                // 速度 = (現在角度 - 上次角度) / 時間差
                if (deltaTimeInSeconds > 0) {
                    elbowVelocity = (smoothElbowAngle - prevSmoothElbow) / deltaTimeInSeconds;
                    kneeVelocity = (smoothKneeAngle - prevSmoothKnee) / deltaTimeInSeconds;
                }
            }

            // 顯示在畫面上，正數代表「伸展(變大)」，負數代表「彎曲(變小)」
            velElbowDisplay.innerText = elbowVelocity.toFixed(0) + ' °/s';
            velKneeDisplay.innerText = kneeVelocity.toFixed(0) + ' °/s';

            // 這裡暫時維持原本的判斷邏輯，等你觀察完角速度後，我們再把這裡改掉！
            if (shotState === 'IDLE') {
                statusDisplay.innerText = "請微蹲準備";
                if (smoothKneeAngle < 140) shotState = 'PREP';
            } 
            else if (shotState === 'PREP') {
                statusDisplay.innerText = "發力中...";
                
                if (smoothKneeAngle > prevSmoothKnee + 2 && smoothKneeAngle > 150 && timeKneePeak === 0) {
                    timeKneePeak = now;
                }
                if (smoothElbowAngle > prevSmoothElbow + 5 && timeElbowStart === 0) {
                    timeElbowStart = now;
                }
                if (smoothElbowAngle > 150 && timeKneePeak > 0 && timeElbowStart > 0) {
                    shotState = 'ANALYZING';
                    const dt = Math.round(timeElbowStart - timeKneePeak);
                    dtDisplay.innerText = dt + " ms";
                    statusDisplay.innerText = "運算中...";
                    
                    setTimeout(() => {
                        if (dt >= 50 && dt <= 150) {
                            playDing(); statusDisplay.innerText = "時序正確 (Ding!)";
                        } else {
                            playBuzz(); statusDisplay.innerText = "時序失準 (Buzz!)";
                        }
                        setTimeout(() => {
                            shotState = 'IDLE'; timeKneePeak = 0; timeElbowStart = 0; dtDisplay.innerText = "-- ms";
                        }, 1500); 
                    }, 500);
                }
            }

            // 記錄這次的數據，留給「下一幀」計算速度用
            prevSmoothKnee = smoothKneeAngle;
            prevSmoothElbow = smoothElbowAngle;
            lastFrameTime = now;
        }

        const pose = new Pose({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
        }});
        pose.setOptions({
            modelComplexity: 0, 
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        pose.onResults(onResults);

        startBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            kneeBuffer = []; elbowBuffer = []; lastFrameTime = 0;
            if (!camera) {
                 camera = new Camera(videoElement, {
                    onFrame: async () => { await pose.send({image: videoElement}); },
                    width: 640, height: 480, facingMode: 'environment'
                });
            }
            camera.start(); isAnalyzing = true;
            startBtn.classList.add('hidden'); stopBtn.classList.remove('hidden');
        });

        stopBtn.addEventListener('click', () => {
            if (camera) camera.stop();
            isAnalyzing = false;
            stopBtn.classList.add('hidden'); startBtn.classList.remove('hidden');
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        });
    </script>
</body>
</html>
