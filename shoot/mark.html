<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>隊友幫記｜Basketball MVP</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="../shared/cloud-config.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
    <script src="../shared/cloud.js" defer></script>
    <script src="./mark.js" defer></script>
</head>
<body>
<header class="topbar"><a href="../">BASKETBALL <strong>MVP</strong></a><span class="tag">隊友幫記</span></header>
<main>
    <section class="hero">
        <p class="eyebrow">TEAMMATE</p>
        <h1>幫隊友記進球</h1>
        <p>輸入投籃者手機上顯示的記錄碼。每投一球，按一次「進」或「沒進」。不需要登入。</p>
    </section>
    <form id="code-form" class="card">
        <label>記錄碼<input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="6 個字元" required></label>
        <button type="submit" class="primary big">開始幫記</button>
    </form>
    <section id="mark-panel" class="card" hidden>
        <p class="muted">記錄碼 <strong id="code-label"></strong> · <button id="change-code" type="button" class="text-like">換一組</button></p>
        <div class="shot-buttons"><button id="made" type="button" class="made">進</button><button id="missed" type="button" class="missed">沒進</button></div>
        <p id="sent" class="focus" role="status">還沒送出任何一球。</p>
        <small>按錯了不用擔心，投籃者結束後可以修正。同一球連按兩次只會算一次。</small>
    </section>
    <p id="message" class="message" role="alert" hidden></p>
</main>
</body>
</html>
